<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Brand Gradient -->
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/> <!-- Red -->
      <stop offset="100%" stop-color="#06B6D4"/> <!-- Cyan -->
    </linearGradient>

    <!-- Inner Glow/Shadow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Node Glow Filter -->
    <filter id="alert-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes pulse-boundary {
        0%, 100% { opacity: 0.8; stroke-width: 14px; }
        50% { opacity: 1; stroke-width: 18px; filter: drop-shadow(0 0 10px rgba(239, 68, 68, 0.4)); }
      }
      @keyframes blink-cursor {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 1; filter: drop-shadow(0 0 8px rgba(239, 68, 68, 0.8)); }
      }
      @keyframes pulse-strike {
        0%, 100% { opacity: 0.9; stroke-width: 28px; }
        50% { opacity: 1; stroke-width: 34px; }
      }
      .animated-boundary {
        animation: pulse-boundary 3s infinite ease-in-out;
      }
      .animated-cursor {
        animation: blink-cursor 1s infinite steps(1);
      }
      .animated-strike {
        animation: pulse-strike 2s infinite ease-in-out;
      }
    </style>
  </defs>

  <!-- Background Plate -->
  <rect width="512" height="512" rx="128" fill="#080a0f" stroke="rgba(255, 255, 255, 0.04)" stroke-width="6"/>
  <circle cx="256" cy="256" r="230" fill="none" stroke="rgba(6, 182, 212, 0.03)" stroke-width="2" stroke-dasharray="10 8"/>

  <!-- Outer Octagon / Terminal Boundary -->
  <polygon 
    points="256,40 416,110 416,402 256,472 96,402 96,110" 
    fill="rgba(10, 10, 14, 0.7)" 
    stroke="url(#brand-grad)" 
    stroke-width="16" 
    stroke-linejoin="round"
    filter="url(#glow)"
    class="animated-boundary"
  />

  <!-- Terminal Brackets inside Hexagon [ ] -->
  <!-- Left Bracket -->
  <path 
    d="M 190,150 L 150,150 L 150,362 L 190,362" 
    fill="none" 
    stroke="rgba(255, 255, 255, 0.08)" 
    stroke-width="12" 
    stroke-linecap="round"
  />

  <!-- Right Bracket -->
  <path 
    d="M 322,150 L 362,150 L 362,362 L 322,362" 
    fill="none" 
    stroke="rgba(255, 255, 255, 0.08)" 
    stroke-width="12" 
    stroke-linecap="round"
  />

  <!-- Main Diagonal Veto Strike-through representing blocking/firewall -->
  <line 
    x1="130" 
    y1="382" 
    x2="382" 
    y2="130" 
    stroke="url(#brand-grad)" 
    stroke-width="32" 
    stroke-linecap="round"
    filter="url(#glow)"
    class="animated-strike"
  />

  <!-- Red Alert Terminal Cursor -->
  <rect 
    x="236" 
    y="236" 
    width="40" 
    height="40" 
    fill="#EF4444" 
    filter="url(#alert-glow)"
    rx="4"
    class="animated-cursor"
  />
</svg>
